<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../static/css/login.css">

    <title>Account Access</title>
</head>

<body>

    <div class="modal-overlay" id="login-modal">

        <div class="login-card">

            <h2>Account Access</h2>

            <!-- ================= ROLE ================= -->

            <div class="role-selection">

                <button
                    type="button"
                    class="role-btn"
                    data-role="user">
                    User
                </button>

                <button
                    type="button"
                    class="role-btn"
                    data-role="admin">
                    Administration
                </button>

            </div>


            <!-- ================= LOGIN / SIGNUP ================= -->

            <div class="mode-selection">

                <button
                    type="button"
                    class="mode-btn active"
                    data-mode="login">
                    Login
                </button>

                <button
                    type="button"
                    class="mode-btn"
                    data-mode="signup">
                    Sign Up
                </button>

            </div>


            <!-- ================= FORM AREA ================= -->

            <div class="form-container">

                <p class="instruction">
                    Select your role to continue
                </p>


                <!-- ================= LOGIN ================= -->

                <form
                    class="auth-form login-form"
                    id="login-form"
                    novalidate>

                    <!-- User Aadhaar -->

                    <div class="user-field">

                        <label for="login-aadhar">
                            Aadhaar Number
                        </label>

                        <input
                            id="login-aadhar"
                            name="aadhar"
                            type="text"
                            inputmode="numeric"
                            maxlength="12"
                            placeholder="Enter 12-digit Aadhaar number">

                        <small class="error-message"></small>

                    </div>


                    <!-- Admin Username -->

                    <div class="admin-field">

                        <label for="login-username">
                            Username
                        </label>

                        <input
                            id="login-username"
                            name="username"
                            type="text"
                            placeholder="Enter username">

                        <small class="error-message"></small>

                    </div>


                    <!-- Password -->

                    <div>

                        <label for="login-password">
                            Password
                        </label>

                        <input
                            id="login-password"
                            name="password"
                            type="password"
                            placeholder="Enter password">

                        <small class="error-message"></small>

                    </div>


                    <p class="form-status"></p>


                    <button
                        type="submit"
                        class="submit-btn">
                        Login
                    </button>

                </form>



                <!-- ================= SIGN UP ================= -->

                <form
                    class="auth-form signup-form"
                    id="signup-form"
                    novalidate>

                    <!-- User Aadhaar -->

                    <div class="user-field">

                        <label for="signup-aadhar">
                            Aadhaar Number
                        </label>

                        <input
                            id="signup-aadhar"
                            name="aadhar"
                            type="text"
                            inputmode="numeric"
                            maxlength="12"
                            placeholder="Enter 12-digit Aadhaar number">

                        <small class="error-message"></small>

                    </div>


                    <!-- User Name -->

                    <div class="user-field">

                        <label for="signup-name">
                            Full Name
                        </label>

                        <input
                            id="signup-name"
                            name="name"
                            type="text"
                            placeholder="Enter your full name">

                        <small class="error-message"></small>

                    </div>


                    <!-- User Mobile -->

                    <div class="user-field">

                        <label for="signup-mobile">
                            Mobile Number
                        </label>

                        <input
                            id="signup-mobile"
                            name="mobile"
                            type="tel"
                            inputmode="numeric"
                            maxlength="10"
                            placeholder="Enter 10-digit mobile number">

                        <small class="error-message"></small>

                    </div>


                    <!-- OTP -->

                    <div class="user-field otp-field">

                        <label for="signup-otp">
                            OTP
                        </label>

                        <input
                            id="signup-otp"
                            name="otp"
                            type="text"
                            inputmode="numeric"
                            maxlength="6"
                            placeholder="Enter 6-digit OTP">

                        <small class="otp-status"></small>
                        <small class="error-message"></small>

                    </div>


                    <!-- Admin Username -->

                    <div class="admin-field">

                        <label for="signup-username">
                            Username
                        </label>

                        <input
                            id="signup-username"
                            name="username"
                            type="text"
                            placeholder="Create username">

                        <small class="error-message"></small>

                    </div>


                    <!-- Password -->

                    <div>

                        <label for="signup-password">
                            Password
                        </label>

                        <input
                            id="signup-password"
                            name="password"
                            type="password"
                            placeholder="Create password">

                        <small class="password-hint">
                            Minimum 8 characters, including uppercase,
                            lowercase and a number.
                        </small>

                        <small class="error-message"></small>

                    </div>


                    <!-- Confirm Password -->

                    <div>

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            id="confirm-password"
                            name="confirm_password"
                            type="password"
                            placeholder="Confirm password">

                        <small class="error-message"></small>

                    </div>


                    <p class="form-status"></p>


                    <button
                        type="submit"
                        class="submit-btn">
                        Sign Up
                    </button>

                </form>

            </div>

        </div>

    </div>

    <script src="../static/js/login.js"></script>

</body>

</html>
